<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Kehadiran - Konter Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body{ background:#f4f7fb; display:flex; min-height:100vh; color:#111827; }

        /* SIDEBAR (NAVIGASI) */
        .sidebar{ width:290px; background: linear-gradient(180deg, #081028, #111f55); color:white; padding:28px 20px; position:fixed; left:0; top:0; height:100vh; display:flex; flex-direction:column; box-shadow: 10px 0 40px rgba(0,0,0,0.15); z-index: 100; }
        .logo{ display:flex; align-items:center; gap:16px; margin-bottom:45px; }
        .logo-box{ width:58px; height:58px; border-radius:18px; background: linear-gradient(135deg, #2563eb, #38bdf8); display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow: 0 10px 25px rgba(37,99,235,0.45); }
        .logo h1{ font-size:20px; line-height:1.1; font-weight:800; }
        .logo p{ color:#cbd5e1; font-size:12px; margin-top:4px; }

        .menu{ list-style:none; display:flex; flex-direction:column; gap:12px; flex:1; }
        .menu a{ text-decoration:none; color:#dbe4ff; display:flex; align-items:center; gap:14px; padding:16px 18px; border-radius:18px; transition:0.3s; font-weight:600; font-size:15px; }
        .menu a i{ width:20px; text-align:center; font-size:18px; }
        .menu a:hover{ background: rgba(255,255,255,0.08); transform:translateX(4px); }
        .menu a.active{ background: linear-gradient(90deg, #2563eb, #38bdf8); color:white; box-shadow: 0 12px 25px rgba(37,99,235,0.35); }

        .logout{ margin-top:20px; }
        .logout a{ display:flex; align-items:center; justify-content:center; gap:10px; padding:16px; border-radius:20px; background: rgba(239,68,68,0.15); color:#fca5a5; text-decoration:none; font-weight:700; transition:0.3s; }
        .logout a:hover{ background:#ef4444; color:white; }

        /* MAIN CONTENT */
        .main{ margin-left:290px; width:calc(100% - 290px); padding:35px; }
        .top-title{ margin-bottom:28px; }
        .top-title h2{ font-size:32px; font-weight:800; color:#111827; }
        .top-title p{ color:#64748b; font-size:15px; }

        /* CARD STYLE */
        .card{ background:white; border-radius:28px; padding:30px; border:1px solid #e2e8f0; box-shadow: 0 10px 30px rgba(15,23,42,0.04); margin-bottom: 28px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .card-header h3 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
        
        /* CHECKLIST STYLE */
        .absensi-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .absensi-item { background: #f8fafc; border: 2px solid #f1f5f9; padding: 18px; border-radius: 18px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.3s; }
        .absensi-item:hover { border-color: #3b82f6; background: #f0f7ff; }
        .absensi-item input[type="checkbox"] { width: 22px; height: 22px; accent-color: #2563eb; cursor: pointer; }
        .absensi-item span { font-weight: 700; color: #334155; font-size: 15px; }

        .empty-state { padding: 30px; text-align: center; background: #fff5f5; border: 1px dashed #feb2b2; border-radius: 15px; color: #c53030; font-weight: 600; grid-column: 1 / -1; }

        .input-date { padding: 10px 15px; border-radius: 12px; border: 1px solid #dbe3ef; font-family: inherit; font-size: 14px; outline: none; }
        .btn-simpan { background: linear-gradient(90deg, #2563eb, #3b82f6); color: white; border: none; padding: 16px 30px; border-radius: 18px; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .btn-simpan:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37,99,235,0.25); }

        /* TABLE */
        table{ width:100%; border-collapse:collapse; }
        th{ text-align:left; padding:16px; color:#64748b; font-size:13px; border-bottom: 1px solid #e2e8f0; text-transform: uppercase; }
        td{ padding:18px 16px; border-bottom: 1px solid #edf2f7; font-weight:600; font-size: 14px; }
        .status-hadir { background: #dcfce7; color: #166534; padding: 6px 14px; border-radius: 10px; font-size: 12px; font-weight: 700; }
        
        @media(max-width:768px){
            .sidebar{ width:80px; padding:20px 12px; }
            .logo-text, .menu a span, .logout a span{ display:none; }
            .main{ margin-left:80px; width:calc(100% - 80px); padding:20px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-box"><i class="fas fa-mobile-alt"></i></div>
            <div class="logo-text">
                <h1>KONTER<br>PRO</h1>
                <p>Accounting System</p>
            </div>
        </div>
        <ul class="menu">
            <li><a href="dashboard.html"><i class="fas fa-th-large"></i> <span>Dashboard</span></a></li>
            <li><a href="karyawan.html"><i class="fas fa-users"></i> <span>Data Karyawan</span></a></li>
            <li><a href="bonus.html"><i class="fas fa-gift"></i> <span>Bonus Penjualan</span></a></li>
            <li><a href="kehadiran.html" class="active"><i class="fas fa-calendar-check"></i> <span>Kehadiran</span></a></li>
            <li><a href="kasbon.html"><i class="fas fa-wallet"></i> <span>Data Kasbon</span></a></li>
            <li><a href="payroll.html"><i class="fas fa-file-invoice-dollar"></i> <span>Payroll Karyawan</span></a></li>
        </ul>
        <div class="logout">
            <a href="index.html"><i class="fas fa-sign-out-alt"></i> <span>Keluar</span></a>
        </div>
    </aside>

    <main class="main">
        <div class="top-title">
            <h2>Manajemen Kehadiran</h2>
            <p>Kelola absensi harian secara real-time.</p>
        </div>

        <div class="card">
            <div class="card-header">
                <h3><i class="fas fa-check-square"></i> Checklist Kehadiran</h3>
                <input type="date" id="absensiDate" class="input-date">
            </div>
            
            <div id="absensiList" class="absensi-container">
                </div>

            <button class="btn-simpan" onclick="simpanAbsensi()">
                <i class="fas fa-save"></i> Simpan Kehadiran Hari Ini
            </button>
        </div>

        <div class="card">
            <div class="card-header">
                <h3><i class="fas fa-history"></i> Riwayat Kehadiran</h3>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span style="font-size: 13px; color: #64748b;">Filter:</span>
                    <input type="date" id="filterDate" class="input-date" onchange="renderRiwayat()">
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Karyawan</th>
                        <th>Tanggal</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="riwayatTable"></tbody>
            </table>
        </div>
    </main>

    <script>
        // Inisialisasi Tanggal Hari Ini
        document.getElementById('absensiDate').valueAsDate = new Date();

        // 1. Fungsi mengambil data karyawan dari karyawan.html (localStorage)
        function renderChecklist() {
            const container = document.getElementById('absensiList');
            const dataKaryawan = JSON.parse(localStorage.getItem('karyawan_pro')) || [];

            if (dataKaryawan.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i> 
                        Belum ada data karyawan. Silakan tambah data di menu Data Karyawan.
                    </div>`;
                return;
            }

            container.innerHTML = dataKaryawan.map(k => `
                <label class="absensi-item">
                    <input type="checkbox" name="karyawan_hadir" value="${k.nama}">
                    <span>${k.nama}</span>
                </label>
            `).join('');
        }

        // 2. Fungsi Simpan Kehadiran
        function simpanAbsensi() {
            const tgl = document.getElementById('absensiDate').value;
            const selected = document.querySelectorAll('input[name="karyawan_hadir"]:checked');
            let dataKehadiran = JSON.parse(localStorage.getItem('kehadiran_pro')) || [];
            
            if (selected.length === 0) {
                alert("Pilih minimal satu karyawan yang hadir!");
                return;
            }

            selected.forEach(cb => {
                const isDuplicate = dataKehadiran.some(d => d.nama === cb.value && d.tanggal === tgl);
                if (!isDuplicate) {
                    dataKehadiran.push({ 
                        nama: cb.value, 
                        tanggal: tgl, 
                        status: 'Hadir' 
                    });
                }
            });

            localStorage.setItem('kehadiran_pro', JSON.stringify(dataKehadiran));
            alert("Absensi berhasil disimpan!");
            renderRiwayat();
            
            selected.forEach(cb => cb.checked = false);
        }

        // 3. Fungsi Render Tabel Riwayat (dengan fitur Filter)
        function renderRiwayat() {
            const tbody = document.getElementById('riwayatTable');
            const filterVal = document.getElementById('filterDate').value;
            const dataKehadiran = JSON.parse(localStorage.getItem('kehadiran_pro')) || [];
            
            let filtered = dataKehadiran;
            if (filterVal) {
                filtered = dataKehadiran.filter(d => d.tanggal === filterVal);
            }

            // Urutkan dari yang terbaru
            filtered.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:#94a3b8;">Tidak ada data absensi.</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map((d, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>${d.nama}</td>
                    <td>${formatTanggalTampilan(d.tanggal)}</td>
                    <td><span class="status-hadir">Hadir</span></td>
                    <td>
                        <button onclick="hapusRiwayat('${d.nama}', '${d.tanggal}')" style="color:#ef4444; border:none; background:none; cursor:pointer;">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Fungsi pembantu untuk hapus data spesifik
        function hapusRiwayat(nama, tgl) {
            if (confirm("Hapus data kehadiran ini?")) {
                let dataKehadiran = JSON.parse(localStorage.getItem('kehadiran_pro')) || [];
                dataKehadiran = dataKehadiran.filter(d => !(d.nama === nama && d.tanggal === tgl));
                localStorage.setItem('kehadiran_pro', JSON.stringify(dataKehadiran));
                renderRiwayat();
            }
        }

        // Fungsi mempercantik tampilan tanggal di tabel
        function formatTanggalTampilan(dateStr) {
            const options = { day: '2-digit', month: 'long', year: 'numeric' };
            return new Date(dateStr).toLocaleDateString('id-ID', options);
        }

        // Jalankan saat halaman dibuka
        renderChecklist();
        renderRiwayat();
    </script>
</body>
</html>
